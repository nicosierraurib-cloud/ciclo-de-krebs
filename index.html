<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo de Krebs en mi cuaderno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap">
<style>
:root{color-scheme:light;--bg:#efe7f6;--paper:#fffdf6;--rule:#cfe2f4;--mar:#f4a3b6;--ink:#3b3a5c;--mut:#7d7a9b;--g:#a8e6c9;--r:#ffb8ab;--b:#aecbff;--y:#ffe590;--n:#d9c9f7;--note:#fff2b0;--ci:#2b2a44;--hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;--body:"Patrick Hand","Segoe Print","Bradley Hand","Comic Sans MS",cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:18px/1.45 var(--body)}
main{max-width:900px;margin:0 auto;padding:14px}
.page{position:relative;padding:18px 14px 22px}


h1{font:700 46px/1.1 var(--hand);margin:0 0 8px}
h1 span{background:linear-gradient(transparent 58%,var(--y) 58%);padding:0 6px}

svg{display:block;width:100%;height:auto}
.g{--c:var(--g)}.r{--c:var(--r)}.b{--c:var(--b)}.y{--c:var(--y)}.n{--c:var(--n)}
.sc{display:none}.sc.on{display:inline;animation:fo .5s}
@keyframes fo{from{opacity:0}}
.v{opacity:0;transition:opacity .6s}.v.show{opacity:1}
.tt{font:700 34px var(--hand);fill:var(--ink);text-anchor:middle}
.ts{font:19px var(--body);fill:var(--mut);text-anchor:middle}
.mn{font:600 27px var(--hand);fill:var(--ink);text-anchor:middle}
.su{font:600 34px var(--hand);fill:var(--ink)}
.sb{font:700 58px var(--hand);fill:var(--ink);text-anchor:middle}
.bd{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}

.hl{fill:var(--c);opacity:.55;animation:pu 1.8s ease-in-out infinite}
@keyframes pu{50%{opacity:.85}}
.dr{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease}
.dr.show{stroke-dashoffset:0}
.ah2{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ch{opacity:0;transition:opacity .5s,transform 1s ease}
.ch.i{transform:translateY(-24px)}
.ch.show{opacity:1}.ch.i.show{transform:none}
.ch.o.show{transform:translateY(18px)}.ch.u.show{transform:translateY(-42px)}
.ch rect{fill:var(--c);stroke:var(--ink);stroke-width:1.8}
.ch text{font:700 21px var(--hand);fill:var(--ci);text-anchor:middle;dominant-baseline:central}
.rg{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:5 5}
.dt circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.dt.d circle{fill:var(--c)}
.dt.a{transform:scale(1.35)}
.dt{transition:transform .4s}
.dt text{font:700 14px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.note{position:relative;background:var(--note);border-radius:4px;padding:18px 16px 14px;margin-top:8px;box-shadow:2px 6px 14px rgba(80,70,120,.18);transform:rotate(-.5deg);display:flex;flex-direction:column;gap:6px}
.note::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--mar) 65%,transparent)}
.note.fi>*:not(.tally){animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(5px)}}
.tg{display:flex;align-items:center;gap:8px;font-size:16px}
.tg i,.tally i{width:14px;height:14px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink);display:inline-block}
#ttl{font:700 30px/1.1 var(--hand);margin:0}
#rx{font-size:16px;color:var(--mut)}
#txt{margin:0;min-height:6.6em}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.tally div{flex:1;min-width:70px;text-align:center;background:var(--c);color:var(--ci);border-radius:12px;padding:2px 6px;font-size:15px;border:1.5px solid var(--ink)}
.tally b{display:block;font:700 28px/1.1 var(--hand)}
.ctl{display:flex;align-items:center;gap:12px;margin-top:16px}
button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--r);color:var(--ci);font-size:18px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--mar)}
#tm{color:var(--mut);font-size:16px;min-width:88px;text-align:right}
@media(max-width:600px){.page{padding:14px 8px 18px}h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){.hl,.sc.on{animation:none}.ch{transition:none}}
</style></head><body>
